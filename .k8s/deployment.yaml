apiVersion: apps/v1
kind: Deployment
metadata:
    name: game-library-auth-deployment
    namespace: game-library
    labels:
        app: game-library-auth
spec:
    replicas: 1
    selector:
        matchLabels:
            app: game-library-auth
    template:
        metadata:
            labels:
                app: game-library-auth
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/metrics"
                prometheus.io/port: "6060"
        spec:
            containers:
              - name: game-library-auth
                image: asctod/game-library-auth:_IMAGE_TAG_
                readinessProbe:
                    httpGet:
                        path: /readiness
                        port: debug
                    initialDelaySeconds: 20
                    periodSeconds: 45
                    timeoutSeconds: 3
                    failureThreshold: 3
                livenessProbe:
                    httpGet:
                        path: /liveness
                        port: debug
                    initialDelaySeconds: 20
                    periodSeconds: 45
                    timeoutSeconds: 1
                    failureThreshold: 3
                ports:
                  - name: api
                    containerPort: 8000
                  - name: debug
                    containerPort: 6060
                  - name: grpc
                    containerPort: 9000
                env:
                  - name: EMAIL_SENDER_UNSUBSCRIBE_SECRET
                    valueFrom:
                        secretKeyRef:
                            name: game-library-auth-email-sender
                            key: EMAIL_SENDER_UNSUBSCRIBE_SECRET
                  - name: KUBERNETES_NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                  - name: KUBERNETES_PODNAME
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                  - name: KUBERNETES_PODIP
                    valueFrom:
                        fieldRef:
                            fieldPath: status.podIP
                  - name: KUBERNETES_NODENAME
                    valueFrom:
                        fieldRef:
                            fieldPath: spec.nodeName
                envFrom:
                  - secretRef:
                        name: game-library-auth-dbconfig
                  - secretRef:
                        name: game-library-auth
                  - configMapRef:
                        name: game-library-auth-config
                imagePullPolicy: Always
                volumeMounts:
                  - name: token-volume
                    mountPath: "/etc/gla"
                    readOnly: true
            volumes:
              - name: token-volume
                secret:
                    secretName: token-cert
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: game-library-auth-worker-deployment
    namespace: game-library
    labels:
        app: game-library-auth-worker
spec:
    replicas: 2
    strategy:
        type: RollingUpdate
    selector:
        matchLabels:
            app: game-library-auth-worker
    template:
        metadata:
            labels:
                app: game-library-auth-worker
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: "/metrics"
                prometheus.io/port: "6060"
        spec:
            terminationGracePeriodSeconds: 45
            containers:
              - name: game-library-auth-worker
                image: asctod/game-library-auth:_IMAGE_TAG_
                command: ["./game-library-auth-worker"]
                imagePullPolicy: Always
                ports:
                  - name: debug
                    containerPort: 6060
                readinessProbe:
                    httpGet:
                        path: /readiness
                        port: debug
                    periodSeconds: 10
                    timeoutSeconds: 3
                livenessProbe:
                    httpGet:
                        path: /liveness
                        port: debug
                    periodSeconds: 15
                    timeoutSeconds: 3
                env:
                  - name: EMAIL_SENDER_API_TOKEN
                    valueFrom:
                        secretKeyRef:
                            name: game-library-auth-email-sender
                            key: EMAIL_SENDER_API_TOKEN
                envFrom:
                  - secretRef:
                        name: game-library-auth-dbconfig
                  - configMapRef:
                        name: game-library-auth-config
